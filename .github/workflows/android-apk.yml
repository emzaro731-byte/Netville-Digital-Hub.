name: Build Netville Android APK and App Bundle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform files
        run: flutter create --platforms=android --project-name netville_digital_hub --org com.netville.digitalhub .
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze Flutter app
        run: flutter analyze
      - name: Build release APK
        run: flutter build apk --release
      - name: Build Play Store App Bundle
        run: flutter build appbundle --release
      - name: Upload Android builds
        uses: actions/upload-artifact@v4
        with:
          name: netville-digital-hub-android-builds
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
